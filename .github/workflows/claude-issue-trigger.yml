
name: Trigger Claude on Approved Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger-claude:
    if: >-
      github.event.label.name == 'claude-ready' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Start Claude Routine
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ROUTINE_URL" || -z "$ROUTINE_TOKEN" ]]; then
            echo "::error::Claude Routine secrets are missing"
            exit 1
          fi

          if [[ "$ROUTINE_URL" != https://api.anthropic.com/v1/claude_code/routines/*/fire ]]; then
            echo "::error::Invalid Claude Routine URL format"
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          message = (
              "Approved implementation task.\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Issue number: {os.environ['ISSUE_NUMBER']}\n"
              f"Issue URL: {os.environ['ISSUE_URL']}\n"
              "The repository owner applied the claude-ready label. "
              "Read the issue and implement only its approved scope. "
              "Do not merge or deploy."
          )

          print(json.dumps({"text": message}))
          PY

          echo "Sending request to Claude Routine..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --retry 0 \
            --request POST "$ROUTINE_URL" \
            --header "Authorization: Bearer $ROUTINE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "Content-Type: application/json" \
            --data-binary @payload.json \
            --output response.json \
            --write-out "%{http_code}")

          echo "Claude API HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            python3 - <<'PY'
          import json

          try:
              with open("response.json") as f:
                  response = json.load(f)

              error = response.get("error", {})
              if isinstance(error, dict):
                  print("API error type:", error.get("type", "unknown"))
                  print("API error message:", error.get("message", "Unknown error"))
              else:
                  print("API error:", str(error))

          except (OSError, ValueError) as exc:
              print("Could not parse API error response:", type(exc).__name__)
          PY

            echo "::error::Claude Routine request failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("response.json") as f:
              result = json.load(f)

          print("Claude Routine API request succeeded.")

          session = result.get("claude_code_session_url")
          if session:
              print("Claude session:", session)
          else:
              print("No session URL returned. Check the Routine dashboard.")
          PY
