<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="../revision.css"><title>Color Stack · Stage A creative direction</title></head><body class="color-stack"><header><a class="brand"><img src="../../../node-server/public/favicon.svg" alt="Playgrid">PLAYGRID</a><span class="game-name">Color Stack</span><div class="head-actions"><button>Rules</button><button class="mute" aria-label="Sound settings">Sound</button></div></header><main class="cs-scene"><div class="opponents"><div class="table-seat"><div class="person"><span class="avatar a1"></span><span><b>Nova</b><small>4 cards</small></span></div><div class="hidden-hand" role="img" aria-label="Nova: 4 face-down cards"><i style="--i:0;--n:4" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:1;--n:4" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:2;--n:4" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:3;--n:4" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i></div></div><div class="table-seat"><div class="person"><span class="avatar a3"></span><span><b>Kai</b><small>6 cards</small></span></div><div class="hidden-hand" role="img" aria-label="Kai: 6 face-down cards"><i style="--i:0;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:1;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:2;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:3;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:4;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:5;--n:6" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i></div></div><div class="table-seat"><div class="person"><span class="avatar a2"></span><span><b>Trouble</b><small>3 cards</small></span></div><div class="hidden-hand" role="img" aria-label="Trouble: 3 face-down cards"><i style="--i:0;--n:3" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:1;--n:3" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i><i style="--i:2;--n:3" aria-hidden="true"><img src="../assets/stack-card-back.svg" alt=""></i></div></div></div><div class="table-orbit"><span class="table-label">COLOR STACK<small>THE NEON SOCIAL CLUB</small></span><div class="discard-row"><div class="deck"><div class="card-back"><img src="../assets/stack-card-back.svg" alt="Original Playgrid Color Stack card back"></div><small>Draw pile · 48</small></div><div class="discard"><button class="playing-card red " aria-label="red 7"><span class="corner">7</span><span class="card-value">7</span><span class="card-color">red</span><span class="corner bottom">7</span></button><small>Match Red or 7</small></div></div><span class="direction-mark">↻</span></div><div class="hand-zone"><div class="row between"><div><span class="eyebrow">YOUR TURN · 0:24</span><p>Choose a card. Make your move.</p></div><div class="person active"><span class="avatar a0"></span><span><b>Alex</b><small>6 cards</small></span></div></div><div class="fan"><button class="playing-card blue " aria-label="blue 2"><span class="corner">2</span><span class="card-value">2</span><span class="card-color">blue</span><span class="corner bottom">2</span></button><button class="playing-card green " aria-label="green 9"><span class="corner">9</span><span class="card-value">9</span><span class="card-color">green</span><span class="corner bottom">9</span></button><button class="playing-card red lift" aria-label="red 5"><span class="corner">5</span><span class="card-value">5</span><span class="card-color">red</span><span class="corner bottom">5</span></button><button class="playing-card yellow " aria-label="yellow +2"><span class="corner">+2</span><span class="card-value">+2</span><span class="card-color">yellow</span><span class="corner bottom">+2</span></button><button class="playing-card blue " aria-label="blue 8"><span class="corner">8</span><span class="card-value">8</span><span class="card-color">blue</span><span class="corner bottom">8</span></button><button class="playing-card wild " aria-label="wild +4"><span class="corner">+4</span><span class="card-value">+4</span><span class="card-color">wild</span><span class="corner bottom">+4</span></button></div></div><div class="action-dock"><span class="selection-label">Red 5 selected</span><button>Draw card</button><button class="primary">Play Red 5</button></div></main><footer><button>← Party</button><span class="party-label">The Friday Crew · Private party</span><div class="row"><button>Players</button><button>Chat <i>2</i></button></div></footer><script>
const cards=[...document.querySelectorAll('.fan .playing-card')];
cards.forEach(c=>c.addEventListener('click',()=>{
 cards.forEach(x=>x.classList.remove('lift'));c.classList.add('lift');
 const label=c.getAttribute('aria-label');const allowed=label==='red 5'||label==='wild +4';
 document.querySelector('.selection-label').textContent=allowed?label+' selected':label+' · does not match Red or 7';
 const action=document.querySelector('.action-dock .primary');action.disabled=!allowed;action.textContent=label==='wild +4'?'Choose color':allowed?'Play Red 5':'Choose a valid card';
}));
</script></body></html>
