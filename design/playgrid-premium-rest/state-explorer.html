<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Playgrid · approved state explorer</title><style>*{box-sizing:border-box}body{margin:0;background:#071722;color:#edf2eb;font:14px Arial}nav{padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{padding:10px;background:#16313e;color:#eff5e9;border:1px solid #53717c;border-radius:6px}p{padding:0 16px;color:#b6c9c7;font-size:12px}#frame{overflow:auto;padding:16px}iframe{border:1px solid #42616c;display:block}label{display:flex;align-items:center;gap:7px}</style><nav><b>APPROVED DESIGN REFERENCE</b><label>Game <select id="game"></select></label><label>State <select id="state"></select></label><label>Viewport <select id="size"><option value="1440,900">Desktop · 1440×900</option><option value="390,844">Phone · 390×844</option><option value="360,740">Narrow · 360×740</option><option value="390,520">Keyboard viewport · 390×520</option></select></label><label><input id="motion" type="checkbox"> Reduced motion preview</label></nav><p>Fixed design examples. Changing these selectors does not play a game or connect to Socket.IO.</p><p id="note"></p><div id="frame"><iframe id="preview" title="Game state design reference"></iframe></div><script>
fetch('state-model.json').then(r=>r.json()).then(games=>{const g=document.querySelector('#game'),s=document.querySelector('#state'),z=document.querySelector('#size'),p=document.querySelector('#preview'),m=document.querySelector('#motion');g.innerHTML=games.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');const wanted=new URLSearchParams(location.search).get('game');g.value=games.some(x=>x.id===wanted)?wanted:games[0].id;function draw(){const x=games.find(x=>x.id===g.value),st=x.states.find(x=>x.id===s.value)||x.states[0],[w,h]=z.value.split(',');p.width=w;p.height=h;p.src=x.id+'/concept.html?state='+st.id+(m.checked?'&reduced=1':'');document.querySelector('#note').textContent=st.trigger+' · '+st.focus;}function pick(){const x=games.find(x=>x.id===g.value);s.innerHTML=x.states.map(st=>`<option value="${st.id}">${st.label}</option>`).join('');s.value='active';draw();}g.onchange=pick;s.onchange=draw;z.onchange=draw;m.onchange=draw;pick();});</script></html>
